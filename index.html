<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Помощник · sql-ex.ru</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>

  <style>
    :root {
      --bg:      #0d1117;
      --card:    #161b22;
      --card2:   #21262d;
      --border:  #30363d;
      --primary: #2563eb;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --green:   #3fb950;
      --red:     #f85149;
      --yellow:  #d29922;
      --blue:    #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .logo-title { font-weight: 700; font-size: 14px; }
    .logo-sub   { font-size: 11px; color: var(--muted); }
    .header-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: var(--card2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 8px 8px 4px;
      text-transform: uppercase;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border: 1px solid transparent;
    }
    .sidebar-item:hover { background: var(--card2); }
    .sidebar-item.active {
      background: rgba(37,99,235,0.15);
      border-color: rgba(37,99,235,0.3);
    }
    .sidebar-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      width: 28px;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 12px;
      color: var(--text);
      line-height: 1.3;
    }
    .sidebar-item.active .sidebar-title { color: var(--blue); }
    .sidebar-empty {
      padding: 20px 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .empty-desc { font-size: 13px; color: var(--muted); max-width: 360px; line-height: 1.7; }

    /* ── Task Content ── */
    .task-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .task-num  { font-size: 13px; color: var(--blue); font-weight: 700; margin-bottom: 4px; }
    .task-db   { font-size: 11px; color: var(--muted); }
    .task-cond {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      margin-top: 6px;
      max-width: 700px;
    }

    /* ── Sections ── */
    .section { margin-bottom: 28px; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .section-icon { font-size: 16px; }

    /* Idea */
    .idea-list { display: flex; flex-direction: column; gap: 8px; }
    .idea-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .idea-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(37,99,235,0.2);
      border: 1px solid rgba(37,99,235,0.4);
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .idea-text { font-size: 13.5px; color: var(--muted); line-height: 1.65; }

    /* Solution */
    .solution-block {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .solution-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card2);
    }
    .solution-bar-label { font-size: 11px; color: var(--muted); font-family: monospace; }
    .copy-btn {
      padding: 3px 10px;
      background: rgba(37,99,235,0.2);
      color: var(--blue);
      border: 1px solid rgba(37,99,235,0.35);
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .copy-btn:hover { background: rgba(37,99,235,0.4); }
    .copy-btn.copied { color: var(--green); border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.15); }
    .solution-code {
      padding: 16px;
      overflow-x: auto;
    }
    .solution-code code {
      font-size: 13.5px !important;
      font-family: 'Fira Code', 'Consolas', monospace !important;
      line-height: 1.8 !important;
    }

    /* Breakdown */
    .breakdown-list { display: flex; flex-direction: column; gap: 0; }
    .breakdown-item {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
    }
    .breakdown-item:first-child { border-radius: 8px 8px 0 0; }
    .breakdown-item:last-child  { border-radius: 0 0 8px 8px; }
    .breakdown-item:not(:first-child) { border-top: none; }
    .breakdown-code {
      width: 280px;
      flex-shrink: 0;
      padding: 10px 14px;
      background: #0d1117;
      border-right: 1px solid var(--border);
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 12.5px;
      color: #79c0ff;
      display: flex;
      align-items: center;
      word-break: break-all;
    }
    .breakdown-explain {
      flex: 1;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      background: var(--card);
      display: flex;
      align-items: center;
    }

    /* Mistakes */
    .mistake-list { display: flex; flex-direction: column; gap: 12px; }
    .mistake-card {
      border: 1px solid rgba(248,81,73,0.25);
      border-radius: 10px;
      overflow: hidden;
    }
    .mistake-header {
      padding: 10px 14px;
      background: rgba(248,81,73,0.08);
      border-bottom: 1px solid rgba(248,81,73,0.2);
    }
    .mistake-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--red);
    }
    .mistake-code {
      padding: 10px 14px;
      background: #0d1117;
      border-bottom: 1px solid var(--border);
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      color: #8b949e;
      white-space: pre-wrap;
    }
    .mistake-explain {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Knowledge */
    .knowledge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .knowledge-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .knowledge-term {
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 6px;
    }
    .knowledge-text {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.65;
    }
    .knowledge-example {
      margin-top: 8px;
      padding: 6px 10px;
      background: #0d1117;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11.5px;
      color: #79c0ff;
      white-space: pre-wrap;
    }

    /* inline code */
    .ic {
      background: rgba(121,192,255,0.12);
      color: #79c0ff;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-title">SQL Помощник</div>
      <div class="logo-sub">sql-ex.ru · PostgreSQL</div>
    </div>
    <div class="header-count" id="headerCount">0 задач</div>
  </div>

  <!-- Layout -->
  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-empty" id="sidebarEmpty">
        Задач пока нет.<br>Они появятся здесь по мере добавления.
      </div>
    </div>

    <!-- Main -->
    <div class="main" id="main">

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📚</div>
        <div class="empty-title">Задачи в разработке</div>
        <div class="empty-desc">
          Сюда будут добавляться разборы задач с sql-ex.ru:<br>
          условие, идея решения, готовый SQL-запрос,<br>
          разбор по строкам, типичные ошибки и база знаний.
        </div>
      </div>

      <!-- Task view -->
      <div class="hidden" id="taskView"></div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       ДАННЫЕ ЗАДАЧ — добавляются автоматически
       ═══════════════════════════════════════════════════════ -->
  <script>
  const TASKS = [
    /* TASKS_START */
    /* TASKS_END */
  ];
  </script>

  <!-- ═══ UI Logic ═══ -->
  <script>
  let activeId = null;

  function init() {
    renderSidebar();
    if (TASKS.length > 0) selectTask(TASKS[0].id);
    updateCount();
  }

  function updateCount() {
    document.getElementById('headerCount').textContent =
      TASKS.length === 0 ? 'Нет задач' :
      TASKS.length === 1 ? '1 задача' :
      TASKS.length < 5  ? `${TASKS.length} задачи` :
                          `${TASKS.length} задач`;
  }

  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    const empty   = document.getElementById('sidebarEmpty');
    if (TASKS.length === 0) { empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    // Group by db
    const groups = {};
    TASKS.forEach(t => {
      if (!groups[t.db]) groups[t.db] = [];
      groups[t.db].push(t);
    });

    sidebar.innerHTML = '';
    Object.entries(groups).forEach(([db, tasks]) => {
      const label = document.createElement('div');
      label.className = 'sidebar-group-label';
      label.textContent = db;
      sidebar.appendChild(label);
      tasks.forEach(t => {
        const item = document.createElement('div');
        item.className = 'sidebar-item';
        item.id = `nav-${t.id}`;
        item.innerHTML = `<span class="sidebar-num">#${t.id}</span><span class="sidebar-title">${t.title}</span>`;
        item.onclick = () => selectTask(t.id);
        sidebar.appendChild(item);
      });
    });
  }

  function selectTask(id) {
    activeId = id;
    const task = TASKS.find(t => t.id === id);
    if (!task) return;

    // Update sidebar active state
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    const nav = document.getElementById(`nav-${id}`);
    if (nav) nav.classList.add('active');

    // Show task view
    document.getElementById('emptyState').classList.add('hidden');
    const view = document.getElementById('taskView');
    view.classList.remove('hidden');
    view.innerHTML = renderTask(task);

    // Highlight SQL
    view.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));

    // Scroll to top
    document.getElementById('main').scrollTop = 0;
  }

  function renderTask(t) {
    return `
      <!-- Header -->
      <div class="task-header">
        <div>
          <div class="task-num">Задание №${t.id}</div>
          <div class="task-db">📦 ${t.db} · PostgreSQL</div>
          <div class="task-cond">${t.condition}</div>
        </div>
      </div>

      <!-- Идея решения -->
      <div class="section">
        <div class="section-title"><span class="section-icon">💡</span> Идея решения</div>
        <div class="idea-list">
          ${t.idea.map((step, i) => `
            <div class="idea-item">
              <div class="idea-num">${i+1}</div>
              <div class="idea-text">${step}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Решение -->
      <div class="section">
        <div class="section-title"><span class="section-icon">✅</span> Готовое решение</div>
        <div class="solution-block">
          <div class="solution-bar">
            <span class="solution-bar-label">sql · PostgreSQL</span>
            <button class="copy-btn" onclick="copySQL(this, ${t.id})">Копировать</button>
          </div>
          <div class="solution-code"><pre><code class="language-sql">${escHtml(t.solution)}</code></pre></div>
        </div>
      </div>

      <!-- Разбор -->
      <div class="section">
        <div class="section-title"><span class="section-icon">📝</span> Разбор по строкам</div>
        <div class="breakdown-list">
          ${t.breakdown.map(b => `
            <div class="breakdown-item">
              <div class="breakdown-code">${escHtml(b.code)}</div>
              <div class="breakdown-explain">${b.explain}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- Ошибки -->
      <div class="section">
        <div class="section-title"><span class="section-icon">❌</span> Типичные ошибки</div>
        <div class="mistake-list">
          ${t.mistakes.map(m => `
            <div class="mistake-card">
              <div class="mistake-header"><div class="mistake-title">❌ ${m.title}</div></div>
              <div class="mistake-code">${escHtml(m.code)}</div>
              <div class="mistake-explain">${m.explain}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <!-- База знаний -->
      <div class="section">
        <div class="section-title"><span class="section-icon">📚</span> База знаний</div>
        <div class="knowledge-grid">
          ${t.knowledge.map(k => `
            <div class="knowledge-card">
              <div class="knowledge-term">${k.term}</div>
              <div class="knowledge-text">${k.text}</div>
              ${k.example ? `<div class="knowledge-example">${escHtml(k.example)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function copySQL(btn, taskId) {
    const task = TASKS.find(t => t.id === taskId);
    if (!task) return;
    navigator.clipboard.writeText(task.solution).then(() => {
      btn.textContent = '✓ Скопировано';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Копировать'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  init();
  </script>
</body>
</html>
